[project]
name = "yefter-ebs-unattached-volumes"
version = "1.0.0"
description = "Find unattached EBS volumes across AWS accounts, estimate the cost, plan their removal"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
